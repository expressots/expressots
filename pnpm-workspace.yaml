packages:
  - "packages/*"
  - "apps/*"
onlyBuiltDependencies:
  - esbuild
  - protobufjs
# Security floors for transitive dependencies whose parents pin ranges
# below the patched release (see `pnpm audit`). Revisit when parents update.
# Keys with `@<major>` scope a floor to one major so a parent on an older
# line is not silently moved onto an incompatible release.
overrides:
  brace-expansion: ">=5.0.9"
  "@opentelemetry/core": ">=2.8.0"
  "@opentelemetry/propagator-jaeger": ">=2.9.0"
  "@hono/node-server": ">=2.0.5"
  # express 5.2.1 pins qs below the fix for the arrayLimit bypass
  "qs": "^6.16.0"
  # vite's postcss pins nanoid 3.3.16; predictable-ID fix landed in 3.3.18
  "nanoid@3": "^3.3.18"
  # istanbul/read-yaml-file (3.x) and changesets/eslint/cosmiconfig (4.x)
  "js-yaml@3": "^3.15.2"
  "js-yaml@4": "^4.3.2"
  # ajv 8 pins fast-uri below the patched release
  "fast-uri": "^3.1.6"
  # @modelcontextprotocol/sdk and @hono/node-server resolve hono below 4.13.5
  "hono": "^4.13.5"
  # apps pin vitest ^4.1.7; 4.1.11 patches the mocker advisory (stay on 4.x)
  "vitest@4": "^4.1.11"
  "@vitest/mocker@4": "^4.1.11"
