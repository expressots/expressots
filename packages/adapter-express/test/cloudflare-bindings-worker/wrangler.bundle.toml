# Config for the bundle-size measurement only: no bindings, so the measured
# output is the framework and the entry file, nothing else.
name = "expressots-cloudflare-bindings-bundle"
compatibility_date = "2026-07-29"
compatibility_flags = ["nodejs_compat"]
[alias]
"iconv-lite" = "./src/shims/iconv-lite.cjs"
# Not installed in Worker projects; see the shim for why the alias is needed here.
"@expressots/studio-agent" = "./src/shims/studio-agent-absent.mjs"
